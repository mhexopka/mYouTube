settings:
  # Авто-определение имени стримера из ссылки
  auto-detect-streamer: true
  
  # Логирование уведомлений в консоль
  log-to-console: true
  
  # Разрешить кликабельные ссылки (требует ProtocolLib)
  clickable-links: false
  
  # Обновлять конфиг автоматически при изменении
  auto-reload-config: true

