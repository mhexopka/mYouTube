name: mYouTube
version: 1.0.0
main: com.verseyt.plugin.VerseYT
api-version: '1.21.11'
author: YourName
description: YouTube Stream and Video Alert Plugin

commands:
  alert:
    description: Отправить уведомление о YouTube стриме или видео
    usage: /alert <СТРИМ/ВИДЕО> <Ссылка>
    permission: ytalert.use
    permission-message: У вас нет прав для использования этой команды!

permissions:
  ytalert.use:
    description: Базовое разрешение для использования команды
    default: false
  ytalert.admin:
    description: Разрешение для админов (получают уведомления от админов)
    default: op
    children:
      ytalert.use: true
  ytalert.youtube:
    description: Разрешение для ютуберов (получают уведомления от ютуберов)
    default: false
    children:
      ytalert.use: true
